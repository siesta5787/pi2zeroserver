# Persistent state on /data (see /etc/fstab)
d /data/rauc               0700 root             root             -
d /data/iwd                0700 root             root             -
d /data/timesync           0755 systemd-timesync systemd-timesync -
d /data/tailscale          0700 root             root             -
d /data/tailscale/state    0700 root             root             -
d /data/tailscale/releases 0755 root             root             -
d /var/lib/iwd             0700 root             root             -
