# Persistent state on /data (see /etc/fstab)
d /data/rauc               0700 root             root             -
d /data/iwd                0700 root             root             -
d /data/timesync           0755 systemd-timesync systemd-timesync -
d /data/agent              0700 root             root             -
# The app this box runs (app-source.json); kept by a factory reset
d /data/box                0755 root             root             -
d /data/tailscale          0700 root             root             -
d /data/tailscale/state    0700 root             root             -
d /data/tailscale/releases 0755 root             root             -
d /var/lib/iwd             0700 root             root             -
d /data/app                0755 root             root             -
d /data/app/releases       0755 root             root             -
d /data/app/snapshots      0700 root             root             -
d /data/app/state          0750 app              app              -
d /data/app/run            0755 root             root             -
L /data/app/run/data       -    -                -                -  ../state
L /data/app/run/static     -    -                -                -  ../current/static
