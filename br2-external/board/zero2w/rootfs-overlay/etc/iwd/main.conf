# iwd only handles Wi-Fi authentication; systemd-networkd does DHCP.
[General]
EnableNetworkConfiguration=false

[Network]
NameResolvingService=systemd

[DriverQuirks]
# Keep the existing wlan0 rather than deleting and recreating interfaces:
# hostapd (setup hotspot, box-hotspot.service) uses wlan0 while iwd is stopped.
# brcmfmac (the Pi) already works this way; mac80211 drivers (QEMU test) don't.
DefaultInterface=*
