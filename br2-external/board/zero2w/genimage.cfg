# SD card layout (see PLAN.md). The 8M gap before p1 holds the redundant
# U-Boot environment at 4M and 4M+64K (zeroed here; U-Boot writes it on
# first boot).

image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start_cd.elf",
			"rpi-firmware/fixup_cd.dat",
			"rpi-firmware/config.txt",
			"rpi-firmware/overlays",
			"bcm2710-rpi-zero-2-w.dtb",
			"u-boot.bin",
			"boot.scr"
		}
	}
	size = 64M
}

image data.ext4 {
	ext4 {
		label = "data"
		use-mke2fs = true
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		partition-table-type = "mbr"
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		offset = 8M
		image = "boot.vfat"
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.ext4"
		size = 512M
	}

	partition rootfs-b {
		partition-type = 0x83
		size = 512M
	}

	# Grown to fill the card on first boot
	partition data {
		partition-type = 0x83
		image = "data.ext4"
	}
}
