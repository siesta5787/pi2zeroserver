[package]
name = "box-agent"
version = "0.1.0"
edition = "2024"
# Buildroot 2026.02 ships Rust 1.88; Cargo picks dependency versions that build with it
rust-version = "1.88"
license = "MIT"
description = "Front door of the Box appliance: system pages, app proxy, updates"
publish = false

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "macros", "process", "fs", "time", "signal"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "net", "macros", "process", "fs", "time", "signal", "rt-multi-thread"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
