[package]
name = "box-agent"
version = "0.1.0"
edition = "2024"
# Buildroot 2026.02 ships Rust 1.88; Cargo picks dependency versions that build with it
rust-version = "1.88"
license = "MIT"
description = "Front door of the Box appliance: system pages, app proxy, updates"
publish = false

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
base64 = "0.22"
blake2 = "0.10"
# System libcurl (already in the image for RAUC) does HTTPS with the OS's OpenSSL and CA certificates
curl = { version = "0.4", default-features = false }
ed25519-dalek = "2"
flate2 = "1"
tar = { version = "0.4", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json", "query", "form"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "macros", "process", "fs", "time", "signal", "io-util"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "macros", "process", "fs", "time", "signal", "io-util", "rt-multi-thread"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
